{% extends admin_base_template %}

{% block head_css %}
    {{ super() }}
    <style>
        /* Fluid width, capped on ultra-wide screens. Content sits flush left/right;
           the navbar's own inset comes from .navbar-inner's padding, not this. */
        .container, .container-fluid {
            box-sizing: border-box !important; /* so width:100% includes padding instead of adding to it */
            width: 100% !important;
            max-width: 2800px !important; /* Cap only ultra-wide monitors; fluid below that */
            margin-right: auto !important;
            margin-left: auto !important;
            display: flex;
            flex-direction: column;
            max-height: 100vh;
        }

        /* Bound the table's own box so it scrolls internally instead of overflowing past the navbar. */
        #no-more-tables {
            width: 100%;
            max-height: calc(100vh - 220px); /* room for navbar + toolbar above; tune if those change height */
            overflow: auto;
        }

        /* Freeze the column header row at the top of that scroll box. */
        #no-more-tables thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            background-color: #fff;
            box-shadow: inset 0 -2px 0 #ddd;
        }
    </style>
{% endblock %}
