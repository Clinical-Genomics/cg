{% extends admin_base_template %}

{% block head_css %}
    {{ super() }}
    <style>
        /* Fluid width, capped on ultra-wide screens. Content sits flush left/right;
           the navbar's own inset comes from .navbar-inner's padding, not this. */
        .container, .container-fluid {
            box-sizing: border-box !important; /* so width:100% includes padding instead of adding to it */
            width: 100% !important;
            max-width: 2800px !important; /* Cap only ultra-wide monitors; fluid below that */
            margin-right: auto !important;
            margin-left: auto !important;
            display: flex;
            flex-direction: column;
            max-height: 100vh;
        }

        /* Bound the table's own box so it scrolls internally instead of overflowing past the navbar. */
        #no-more-tables {
            width: 100%;
            max-height: calc(100vh - 220px); /* room for navbar + toolbar above; tune if those change height */
            overflow: auto;
        }

        /* Freeze the column header row at the top of that scroll box. */
        #no-more-tables thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            background-color: #fff;
            box-shadow: inset 0 -2px 0 #ddd;
        }
    </style>
    <script>

    // --- Type directly in searchbar ---
    document.addEventListener('keydown', function (e) {
      /* Gets search field if there is one. */
      const search = document.querySelector('input[name="search"]');
      if (!search) return;

      /* Ensure to not block writing in any field that is not the search field. */
      const el = document.activeElement;
      if (['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(el.tagName) ||
        el.isContentEditable) return;

      /* Ensure to not block shortcuts and only add single letters to search field. */
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key.length !== 1) return;

      /* Glues the typing to search field. */
      search.focus();
    });

    // --- Shift-Select Checkboxes ---
    document.addEventListener('DOMContentLoaded', function () {
      let lastChecked = null;

      // Listen for clicks on the table body inside your scrolled box container
      const tableBody = document.querySelector('#no-more-tables tbody');
      if (!tableBody) return;

      tableBody.addEventListener('click', function (e) {
        const target = e.target;

        // Target Flask-Admin row checkboxes specifically
        if (!target.classList.contains('action-checkbox')) return;

        // If shift key is held and user has already clicked a row checkbox during this session
        if (e.shiftKey && lastChecked) {
          const checkboxes = Array.from(tableBody.querySelectorAll('.action-checkbox'));
          const start = checkboxes.indexOf(target);
          const end = checkboxes.indexOf(lastChecked);

          // Get all checkboxes sitting between the boundaries of the selection range
          const range = checkboxes.slice(Math.min(start, end), Math.max(start, end) + 1);

          range.forEach(checkbox => {
            checkbox.checked = target.checked;

            // Dispatches change event to alert Flask-Admin's master action menu counters
            checkbox.dispatchEvent(new Event('change', { bubbles: true }));
          });
        }

        // Track this checkbox as the starting anchor for the next potential shift-click
        lastChecked = target;
      });
    });
    </script>
{% endblock %}
