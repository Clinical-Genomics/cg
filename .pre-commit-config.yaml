repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: poetry run isort
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: poetry run ruff check --force-exclude
        language: system
        types: [python]
      - id: vulture
        name: vulture
        entry: poetry run vulture
        language: system
        pass_filenames: false
